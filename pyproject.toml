[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zeta-explorer"
version = "0.1.0"
description = "Explore the Riemann zeta function from scratch: Riemann-Siegel Z, zeta(s), Gram blocks, Turing verification, fast multi-evaluation of Z, the explicit formula for pi(x), Lehmer pairs and value distributions."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Louis Belot" }]
keywords = ["riemann-zeta", "riemann-hypothesis", "number-theory", "visualization", "riemann-siegel", "explicit-formula", "random-matrix-theory", "nufft", "odlyzko-schonhage"]
dependencies = [
    "numpy>=1.24",
    "mpmath>=1.3",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7", "ruff>=0.4", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/louisbelot/zeta-explorer"

[tool.hatch.build.targets.wheel]
packages = ["src/zeta_explorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
